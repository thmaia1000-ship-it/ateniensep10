# ==============================================================================
# Configuração Nginx para ateniensep10.agenciabr3.com.br (Proxy Reverso Python)
# Salve este arquivo em: /etc/nginx/sites-available/ateniense
# E crie o link simbólico: ln -s /etc/nginx/sites-available/ateniense /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ateniensep10.agenciabr3.com.br;

    # Redirecionamento automático HTTP -> HTTPS (quando SSL estiver ativo)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # Cabeçalhos de repasse de host e IP real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets e conexões persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts generosos para relatórios e importações
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Limite máximo de upload para anexos e banco SQL
        client_max_body_size 100M;
    }

    # Compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}

